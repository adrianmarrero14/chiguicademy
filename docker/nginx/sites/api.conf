upstream api_upstream {
    server api:3001;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/chiguicademy_access.log;
    error_log /var/log/nginx/chiguicademy_error.log;

    # Large uploads (course videos)
    client_max_body_size 512M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Nginx own liveness (does not depend on the API)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Everything else goes to NestJS (/api/*, /docs/api).
    # CORS is handled by the application, not here.
    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (future realtime features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
